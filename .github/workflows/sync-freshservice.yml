name: Refresh ITS ticket snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: its-freshservice-sync
  cancel-in-progress: false
jobs:
  refresh:
    # Explicit approval gate for publishing operational metrics to PUBLIC GitHub Pages.
    if: ${{ vars.PUBLIC_METRICS_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch aggregate counts (read only)
        env:
          FRESHSERVICE_API_KEY: ${{ secrets.FRESHSERVICE_API_KEY }}
          FRESHSERVICE_UNRESOLVED_STATUSES: ${{ vars.FRESHSERVICE_UNRESOLVED_STATUSES }}
        run: python3 scripts/sync_freshservice.py
      - name: Commit only aggregate JSON if changed
        run: |
          git add ticket-stats.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh public aggregate ticket snapshot'
            git push
          fi
